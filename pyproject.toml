[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "campuspulse-agent"
version = "0.1.0"
description = "CampusPulse AI agent: Gemini + Google ADK with CampusPulse and Moodle tools, deployable to Vertex AI Agent Engine"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.0",
    "httpx>=0.27",
    "mcp>=1.9,<2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
deploy = ["google-cloud-aiplatform[agent_engines,adk]>=1.100"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/campuspulse_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
