# gcloud builds submit --config cloudbuild.yaml --substitutions=_IMAGE=...,_API_URL=...,_GOOGLE_CLIENT_ID=...
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg=VITE_API_URL=${_API_URL}
      - --build-arg=VITE_GOOGLE_CLIENT_ID=${_GOOGLE_CLIENT_ID}
      - --build-arg=VITE_ENABLE_DEMO_LOGIN=false
      - -t
      - ${_IMAGE}
      - .
images:
  - ${_IMAGE}
