name: campuspulse-infrastructure

services:
  postgres:
    image: postgres:17-alpine
    container_name: campuspulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campuspulse}
      POSTGRES_USER: ${POSTGRES_USER:-campuspulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campuspulse}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-campuspulse} -d ${POSTGRES_DB:-campuspulse}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    expose:
      - "5432"
    volumes:
      - campuspulse-postgres-data:/var/lib/postgresql/data
    networks:
      campuspulse:
        aliases:
          - postgres

volumes:
  campuspulse-postgres-data:

networks:
  campuspulse:
    name: campuspulse-network
