name: campuspulse-app

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: campuspulse-api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      CAMPUSPULSE_DATABASE_URL: >-
        postgresql+psycopg://${POSTGRES_USER:-campuspulse}:${POSTGRES_PASSWORD:-campuspulse}@postgres:5432/${POSTGRES_DB:-campuspulse}
      CAMPUSPULSE_API_V1_PREFIX: /api/v1
      CAMPUSPULSE_ENABLE_DEMO_AUTH: "true"
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations
      - ./storage:/app/storage
    ports:
      - "${API_PORT:-8000}:8000"
    networks:
      - campuspulse

networks:
  campuspulse:
    name: campuspulse-network
    external: true
