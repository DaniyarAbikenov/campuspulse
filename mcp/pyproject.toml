[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "campuspulse-mcp"
version = "0.1.0"
description = "MCP servers that give the CampusPulse agent read-only access to external student systems"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9,<2",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
campuspulse-moodle-mcp = "campuspulse_mcp.server:main"
campuspulse-moodle-sync = "campuspulse_mcp.sync:main"

[tool.hatch.build.targets.wheel]
packages = ["src/campuspulse_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]
